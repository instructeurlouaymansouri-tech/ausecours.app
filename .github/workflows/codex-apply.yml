name: Apply Codex AUSECOURS build

on:
  push:
    branches: [codex/premium-ausecours-2026]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore generated source
        env:
          PAYLOAD_B64: 
        run: |
          echo "$PAYLOAD_B64" | base64 -d > /tmp/ausecours-src.tar.gz
          rm -rf src
          tar -xzf /tmp/ausecours-src.tar.gz
      - name: Commit generated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git diff --cached --quiet && exit 0
          git commit -m "feat: premium AUSECOURS emergency platform"
          git push origin HEAD:codex/premium-ausecours-2026
